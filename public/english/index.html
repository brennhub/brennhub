<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>SCENE LOOP: 유튜브로 영어 공부</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root {
  --desk: #2E3A44; --desk-2: #25303A; --desk-text: #E9EEF1; --desk-muted: #B3BFC8; --desk-line: #46545F;
  --paper: #F6F7F3; --paper-2: #ECEEE8; --ink: #1D2126; --ink-2: #4A535C; --rule: #CFD4CC;
  --hl: #FFE14D; --red: #C2311D; --blue: #1F4FC4; --gold: #B98A12;
  --p1: #DCEAF8; --p2: #FBE0E7; --p3: #FFF3BF; --p4: #DDF1DE; --p5: #F9E2B4; --p6: #F8D8CB;
  --script: "Courier Prime", "Courier New", Courier, monospace;
  --ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --lift: 0 1px 0 rgba(0,0,0,.25), 0 10px 22px rgba(10,16,22,.28);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--desk); color: var(--desk-text); font-family: var(--ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 3px solid #8FB6FF; outline-offset: 2px; }
.paper :focus-visible, .sheet :focus-visible, .dialog :focus-visible { outline-color: var(--blue); }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
a { color: var(--blue); }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 20px; background: var(--desk-2); border-bottom: 1px solid var(--desk-line); }
.brand { font-family: var(--script); font-weight: 700; font-size: 20px; letter-spacing: .04em; background: none; border: 0; padding: 4px 0; color: var(--desk-text); }
.brand small { font-family: var(--ui); font-weight: 400; font-size: 12px; color: var(--desk-muted); margin-left: 8px; letter-spacing: 0; }
.nav { display: flex; flex-wrap: wrap; gap: 2px; }
.nav button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; min-height: 40px; color: var(--desk-muted); }
.nav button[aria-current="page"] { color: var(--desk-text); border-bottom-color: var(--hl); font-weight: 600; }
.nav .n { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 10px; background: var(--hl); color: var(--ink); font-size: 12px; font-weight: 600; text-align: center; }
.hud { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--desk-line); font-size: 13px; color: var(--desk-text); }
.pill.on { border-color: #7FB08A; } .pill.off { border-style: dashed; color: var(--desk-muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #7FCB8F; } .pill.off .dot { background: none; border: 1.5px solid var(--desk-muted); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); font-weight: 500; }
.btn:hover:not(:disabled) { background: #fff; }
.btn.dark { background: var(--ink); color: var(--paper); } .btn.dark:hover:not(:disabled) { background: #000; }
.btn.hl { background: var(--hl); border-color: var(--ink); font-weight: 600; } .btn.hl:hover:not(:disabled) { background: #FFD21A; }
.btn.rec { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; border-color: var(--desk-line); color: var(--desk-text); } .btn.ghost:hover:not(:disabled) { background: rgba(255,255,255,.08); }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 13px; }
.btn.big { min-height: 48px; padding: 0 22px; font-size: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--ink-2); background: transparent; color: var(--ink); font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.desk { border-color: var(--desk-line); color: var(--desk-text); } .chip.desk[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.chip.idi { border-style: dotted; border-width: 2px; } .chip.redc { border-color: var(--blue); color: var(--blue); }
@media (pointer: coarse) { .chip, .btn.sm { min-height: 44px; } .btn { min-height: 44px; } }
.ic { width: 18px; height: 18px; flex: none; }

/* layout */
.study { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; max-width: 1500px; margin: 0 auto; padding: 18px 20px 48px; }
.stagecol { flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.scriptcol { flex: 1 1 340px; min-width: 0; }
.paper { background: var(--paper); color: var(--ink); border-radius: 3px; box-shadow: var(--lift); }
.muted { color: var(--ink-2); } .desk-muted { color: var(--desk-muted); }
.small { font-size: 13px; } .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; } .col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; } .sep { width: 1px; align-self: stretch; background: var(--desk-line); margin: 0 4px; }

/* stage */
.stage { position: relative; background: #000; border-radius: 3px; overflow: hidden; aspect-ratio: 16 / 9; max-height: 40vh; width: 100%; box-shadow: var(--lift); }
.stage.big { max-height: 78vh; }
.stage.novid { aspect-ratio: auto; max-height: none; }
.stage.novid .stage-note { position: static; padding: 48px 24px 28px; }
.stage video { width: 100%; height: 100%; display: block; background: #000; }
.stage-note { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: #0D1318; color: var(--desk-text); }
.stage-note h2 { font-family: var(--script); font-size: clamp(20px, 2.4vw, 30px); }
.stage-note p { max-width: 56ch; color: var(--desk-muted); }
.stage-tags { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.tag { display: inline-block; padding: 3px 9px; border-radius: 3px; background: rgba(0,0,0,.72); color: #fff; font-size: 12px; }
.tag.warn { background: var(--hl); color: var(--ink); font-weight: 600; } .tag.err { background: var(--red); }

/* strip: the current line on paper */
.strip { padding: 12px 18px 16px; }
.strip-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 8px; }
.strip-meta { font-family: var(--script); font-size: 14px; color: var(--ink-2); }
.words { font-family: var(--script); font-weight: 700; font-size: clamp(22px, 2.5vw, 34px); line-height: 1.9; min-height: 1.9em; word-spacing: .12em; }
.w { border-radius: 3px; padding: 0 1px; cursor: text; }
.w.now { background: var(--hl); }
.w.idi { border-bottom: 3px dotted var(--ink); padding-bottom: 9px; }
.w.redu { text-decoration: underline wavy var(--blue); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.w.miss { color: var(--red); outline: 2px dashed var(--red); outline-offset: 1px; }
.w.slot { display: inline-block; height: .78em; background: var(--ink); border-radius: 2px; vertical-align: baseline; cursor: default; margin-right: .5ch; }
.w.slot.now { background: var(--gold); }
.strip.blur .w { filter: blur(8px); } .strip.blur .words:hover .w, .strip.blur .words:focus .w { filter: none; }
.ko { margin-top: 6px; font-size: 16px; color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.legend i { font-style: normal; font-family: var(--script); font-weight: 700; color: var(--ink); }
.lg-idi { border-bottom: 3px dotted var(--ink); } .lg-red { text-decoration: underline wavy var(--blue); text-underline-offset: 4px; } .lg-now { background: var(--hl); padding: 0 3px; }

/* scene timeline */
.timeline { display: flex; gap: 3px; align-items: stretch; }
.tl { flex: 1 1 0; min-width: 10px; height: 26px; padding: 8px 0; background: none; border: 0; }
.tl span { display: block; height: 10px; border-radius: 2px; border: 1.5px solid var(--desk-muted); }
.tl.s1 span { background: #6E7F8C; border-color: #6E7F8C; } .tl.s2 span { background: #A9B8C3; border-color: #A9B8C3; } .tl.s3 span { background: var(--paper); border-color: var(--paper); }
.tl.cur span { background: var(--hl); border-color: var(--hl); height: 14px; margin-top: -2px; }
.tl.mine span { border-color: var(--red); border-width: 2px; }

/* transport */
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.offset { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; border: 1px dashed var(--desk-line); border-radius: 8px; font-size: 13px; color: var(--desk-muted); }

/* passes */
.tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; align-items: end; }
.tab { border: 0; border-radius: 6px 6px 0 0; padding: 7px 4px 9px; min-height: 48px; background: var(--paper-2); color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 0; opacity: .82; }
.tab b { font-family: var(--script); font-size: 13px; } .tab span { font-size: 14px; font-weight: 500; }
.tab[aria-selected="true"] { opacity: 1; color: var(--ink); padding-top: 11px; font-weight: 600; }
.tab.t1 { background: var(--p1); } .tab.t2 { background: var(--p2); } .tab.t3 { background: var(--p3); } .tab.t4 { background: var(--p4); } .tab.t5 { background: var(--p5); } .tab.t6 { background: var(--p6); }
.panel { padding: 18px 20px 22px; border-radius: 0 0 3px 3px; box-shadow: var(--lift); color: var(--ink); min-height: 230px; display: flex; flex-direction: column; gap: 14px; }
.panel.t1 { background: var(--p1); } .panel.t2 { background: var(--p2); } .panel.t3 { background: var(--p3); } .panel.t4 { background: var(--p4); } .panel.t5 { background: var(--p5); } .panel.t6 { background: var(--p6); }
.panel h2 { font-size: 18px; font-weight: 600; }
.panel .muted { color: #3D464E; }
.box { border: 1.5px solid rgba(29,33,38,.35); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,.35); }
.box h3 { font-size: 15px; font-weight: 600; }
.cards3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.field { min-height: 48px; width: 100%; padding: 0 14px; border-radius: 6px; border: 1.5px solid var(--ink); background: #fff; color: var(--ink); font-family: var(--script); font-size: 19px; }
textarea.field { padding: 10px 14px; min-height: 80px; font-size: 16px; }
.score { font-family: var(--script); font-weight: 700; font-size: 30px; }
.diff { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--script); font-weight: 700; font-size: 19px; }
.diff span { padding: 1px 7px; border-radius: 4px; border: 1.5px solid rgba(29,33,38,.3); background: rgba(255,255,255,.5); }
.diff .x { color: var(--red); border: 1.5px dashed var(--red); }
.diff small { font-family: var(--ui); font-weight: 500; font-size: 11px; margin-left: 5px; }
.stars { display: inline-flex; gap: 2px; vertical-align: middle; } .stars svg { width: 20px; height: 20px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 6px; background: var(--hl); color: var(--ink); font-weight: 500; }
.need { padding: 10px 14px; border: 1.5px dashed var(--ink-2); border-radius: 6px; font-size: 14px; background: rgba(255,255,255,.35); }
canvas.pitch { width: 100%; height: 130px; background: #fff; border: 1.5px solid rgba(29,33,38,.35); border-radius: 6px; }
.meter { height: 10px; border-radius: 5px; background: rgba(29,33,38,.15); overflow: hidden; } .meter i { display: block; height: 100%; background: var(--ink); }
.dubrow { display: flex; align-items: center; gap: 10px; padding: 4px 8px; border-radius: 6px; font-family: var(--script); font-size: 15px; }
.dubrow.mine { background: rgba(255,255,255,.65); font-weight: 700; } .dubrow.act { outline: 3px solid var(--red); }
.dubrow .t { flex: 1; min-width: 0; }

/* script column */
.script { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.script h2 { font-family: var(--script); font-size: 18px; }
.lines { display: flex; flex-direction: column; }
.ln { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--rule); padding: 9px 6px; min-height: 44px; color: var(--ink); font-family: var(--script); font-size: 15px; line-height: 1.4; }
.ln:hover { background: var(--paper-2); }
.ln[aria-current="true"] { background: var(--hl); font-weight: 700; }
.ln .no { min-width: 30px; color: var(--ink-2); font-size: 12px; } .ln .tx { flex: 1; min-width: 0; } .ln .st { font-family: var(--ui); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.ln .sp { display: block; font-size: 11px; color: var(--ink-2); font-weight: 400; }
.bar-r { display: inline-block; height: .7em; background: var(--ink); border-radius: 2px; margin-right: .5ch; opacity: .8; }

/* side sheet */
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); z-index: 30; background: var(--paper); color: var(--ink); box-shadow: -14px 0 34px rgba(0,0,0,.35); overflow-y: auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 16px; }
.sheet h2 { font-family: var(--script); font-size: 26px; line-height: 1.25; }
.sheet h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.sheet section { border-top: 1px solid var(--rule); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.hit { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--rule); background: #fff; color: var(--ink); min-height: 44px; }
.hit .e { font-family: var(--script); font-size: 15px; } .hit small { display: block; color: var(--ink-2); font-size: 12px; }
.kind { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 3px; background: var(--ink); color: var(--paper); }
.kind.rare { background: var(--gold); }

/* dialog */
.veil { position: fixed; inset: 0; z-index: 40; background: rgba(13,19,24,.62); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto; }
.dialog { width: min(760px, 100%); background: var(--paper); color: var(--ink); border-radius: 3px; box-shadow: var(--lift); padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.dialog h2 { font-size: 20px; font-weight: 600; }
.dialog h3 { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-top: 6px; }
.sw { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; min-height: 44px; border: 0; border-top: 1px solid var(--rule); background: none; color: var(--ink); }
.sw:hover { background: var(--paper-2); }
.sw .lb { flex: 1; } .state { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1.5px solid var(--ink); white-space: nowrap; }
.state.on { background: var(--ink); color: var(--paper); } .state.later { border-style: dashed; color: var(--ink-2); border-color: var(--ink-2); } .state.no { border-color: var(--red); color: var(--red); }
.envlist { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; } .envlist dt { font-weight: 600; } .envlist dd { margin: 0; }
.eprow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 6px; border-top: 1px solid var(--rule); }
.eprow .ti { font-family: var(--script); font-weight: 700; flex: 1 1 220px; min-width: 0; }
.dropzone { border: 2px dashed var(--ink-2); border-radius: 6px; padding: 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.dropveil { position: fixed; inset: 0; z-index: 60; background: rgba(255,225,77,.92); color: var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--script); font-size: clamp(24px, 4vw, 44px); font-weight: 700; pointer-events: none; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 70; max-width: min(92vw, 640px); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 8px; border: 1px solid #000; font-weight: 500; box-shadow: var(--lift); }
.chat { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto; padding: 4px; }
.msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--rule); font-family: var(--script); }
.msg.me { align-self: flex-end; background: var(--p1); } .msg.sys { align-self: center; background: none; border: 0; font-family: var(--ui); font-size: 13px; color: var(--ink-2); }

/* other views */
.page { max-width: 1100px; margin: 0 auto; padding: 20px 20px 56px; display: flex; flex-direction: column; gap: 18px; }
.sheetp { padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 12px; }
.sheetp h2 { font-size: 20px; font-weight: 600; } .sheetp h3 { font-size: 15px; font-weight: 600; }
.flash { padding: 26px 24px; min-height: 300px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.flash .q { font-family: var(--script); font-weight: 700; font-size: clamp(22px, 2.6vw, 32px); line-height: 1.4; }
.flash img { max-width: 240px; border-radius: 3px; border: 1px solid var(--rule); }
.gridc { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.cardc { text-align: left; background: #fff; border: 1px solid var(--rule); border-radius: 3px; padding: 0 0 10px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; min-height: 44px; overflow: hidden; }
.cardc.gold { border: 2px solid var(--gold); background: #FFF9E2; }
.cardc .th { aspect-ratio: 16 / 9; background: var(--desk) center / cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--desk-muted); font-size: 12px; }
.cardc .k { font-family: var(--script); font-weight: 700; padding: 6px 10px 0; } .cardc .m { padding: 0 10px; font-size: 13px; color: var(--ink-2); } .cardc .tg { padding: 2px 10px 0; display: flex; gap: 6px; flex-wrap: wrap; }
.season { display: flex; align-items: center; gap: 10px; } .season b { min-width: 64px; font-family: var(--script); }
.cells { display: flex; flex-wrap: wrap; gap: 4px; }
.cell { width: 32px; height: 32px; border-radius: 3px; border: 1.5px dashed var(--ink-2); background: none; color: var(--ink-2); font-family: var(--script); font-size: 12px; position: relative; overflow: hidden; padding: 0; }
.cell.has { border-style: solid; border-color: var(--ink); color: var(--ink); background: #fff; }
.cell.vid::after { content: ""; position: absolute; right: 3px; top: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
.cell i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--hl); z-index: 0; } .cell em { position: relative; z-index: 1; font-style: normal; }
.cell.boss { background: var(--ink); color: var(--paper); border-color: var(--ink); } .cell.cur { outline: 3px solid var(--blue); outline-offset: 1px; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; } table.t th, table.t td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--rule); vertical-align: middle; } table.t th { font-weight: 600; color: var(--ink-2); font-size: 13px; } table.t .btn { white-space: nowrap; }
.hbar { height: 12px; background: var(--paper-2); border-radius: 2px; min-width: 120px; } .hbar i { display: block; height: 100%; background: var(--ink); border-radius: 2px; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; } .badge { padding: 6px 12px; border-radius: 3px; border: 1.5px dashed var(--ink-2); color: var(--ink-2); font-size: 13px; } .badge.got { border: 1.5px solid var(--gold); background: #FFF4CC; color: var(--ink); font-weight: 600; }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; } .dl dt { color: var(--ink-2); } .dl dd { margin: 0; font-family: var(--script); font-weight: 700; }
@media (max-width: 720px) { .bar { padding: 8px 12px; } .study { padding: 12px 10px 40px; } .tab span { font-size: 12px; } .panel { padding: 14px; } .hud { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
/* YouTube build */
.ythost { width: 100%; height: 100%; }
.ythost[hidden] { display: none; }
.ythost iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
.ytadd { display: flex; flex-direction: column; gap: 6px; }
.ytadd .fl { font-weight: 600; margin-top: 8px; }
.ytadd .field { width: 100%; font-size: 16px; }
.ytadd textarea.field { min-height: 160px; padding: 10px 14px; resize: vertical; font-family: var(--script); line-height: 1.45; }
.ytadd .err { color: #B3261E; font-weight: 600; }

  }

  // ---------- views, nav, hud ----------
  var VIEWS = [["study", "학습"], ["review", "복습"], ["cards", "도감"], ["map", YTMODE ? "영상 목록" : "지도"], ["stats", "내 실력"]];
  function renderNav() {
    var nav = clear($("nav")), due = feat("srs") ? dueCards().length : 0;
    VIEWS.forEach(function (v) {
      nav.appendChild(h("button", { type: "button", "aria-current": V.view === v[0] ? "page" : null, onclick: function () { setView(v[0]); } }, v[1], v[0] === "review" && due ? h("span", { class: "n", text: String(due), "aria-label": "복습할 카드 " + due + "장" }) : null));
    });
  }
  function renderHud() {
    var hud = clear($("hud"));
    if (feat("combo")) hud.appendChild(h("span", { class: "pill", text: "콤보 " + (S.stats.combo || 0) }));
    hud.appendChild(h("span", { class: "pill " + (Env.ai ? "on" : "off") }, h("span", { class: "dot" }), YTMODE ? (Env.ai ? "해설: BrennHub Local" : "AI: Claude에 복사해서 질문") : "AI 해설: " + (Env.ai ? "켜짐" : "꺼짐")));
    if (feat("search")) hud.appendChild(btn("검색", function () { openModal(searchDialog); setTimeout(function () { var n = $("searchIn"); if (n) n.focus(); }, 30); }, "ghost sm", "search"));
    hud.appendChild(btn("라이브러리", function () { V.epDel = null; openModal(YTMODE ? ytLibraryDialog : libraryDialog); }, "ghost sm", "folder"));
    hud.appendChild(btn("기능 스위치", function () { openModal(settingsDialog); }, "ghost sm", "sliders"));
  }
  function renderView() {
    var study = $("viewStudy"), other = clear($("viewOther"));
    study.hidden = V.view !== "study"; other.hidden = V.view === "study";
    if (V.view === "study") { renderStudy(); return; }
    ({ review: renderReview, cards: renderCards, map: renderMap, stats: renderStats })[V.view](other);
  }
  function setView(v) {
    if (!VIEWS.some(function (x) { return x[0] === v; })) v = "study";
    stopAll(); if (v !== "study" && V.watch) endWatch();
    if (v !== "review") V.review = null;
    V.view = v;
    try { if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v); } catch (e) { /* hash not available */ }
    if (v === "study") attachVideo(curEp());
    renderNav(); renderView();
    window.scrollTo(0, 0);
  }
  function renderAll() { renderNav(); renderHud(); renderView(); }

  // ---------- events ----------
  function selectionOverlaps(range, node) {
    var r = document.createRange(); r.selectNodeContents(node);
    return range.compareBoundaryPoints(Range.END_TO_START, r) < 0 && range.compareBoundaryPoints(Range.START_TO_END, r) > 0;
  }
  function checkSelection() {
    var sel = window.getSelection(); if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    var box = $("words"); if (!box || !box.contains(sel.anchorNode) || !box.contains(sel.focusNode)) return;
    var range = sel.getRangeAt(0), spans = box.querySelectorAll(".w:not(.slot)"), a = -1, b = -1;
    for (var i = 0; i < spans.length; i++) if (selectionOverlaps(range, spans[i])) { var wi = +spans[i].getAttribute("data-wi"); if (a < 0) a = wi; b = wi; }
    if (a < 0 || a === b) return;
    sel.removeAllRanges();
    openPopupSpan(a, b);
  }
  function bind() {
    document.addEventListener("mouseup", function () { setTimeout(checkSelection, 0); });
    document.addEventListener("touchend", function () { setTimeout(checkSelection, 60); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { if (V.popup) { closePopup(); e.preventDefault(); } else if (V.modal) { closeModal(); e.preventDefault(); } return; }
      var t = e.target, tag = t && t.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.ctrlKey || e.metaKey || e.altKey || V.modal || V.view !== "study" || V.watch) return;
      if (e.key === " " || e.code === "Space") { if (tag === "BUTTON" && t.id === "playBtn") return; e.preventDefault(); togglePlay(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); gotoLine(S.cur.li - 1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); gotoLine(S.cur.li + 1); }
      else if (e.key === "r" || e.key === "R") { stopAll(); playCurrent(); }
      else if (/^[1-6]$/.test(e.key) && STEPS[+e.key - 1]) setStep(STEPS[+e.key - 1][0]);
    });
    var depth = 0;
    window.addEventListener("dragenter", function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") >= 0) { depth++; $("drop").hidden = false; e.preventDefault(); } });
    window.addEventListener("dragover", function (e) { e.preventDefault(); });
    window.addEventListener("dragleave", function () { depth = Math.max(0, depth - 1); if (!depth) $("drop").hidden = true; });
    window.addEventListener("drop", function (e) { e.preventDefault(); depth = 0; $("drop").hidden = true; if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) (YTMODE ? ytDrop : handleFiles)(e.dataTransfer.files); });
    $("filePick").addEventListener("change", function (e) { var fs = Array.prototype.slice.call(e.target.files || []); e.target.value = ""; if (YTMODE) { ytDrop(fs); return; } closeModal(); handleFiles(fs); });
    $("modal").addEventListener("mousedown", function (e) { if (e.target === $("modal")) closeModal(); });
    $("brand").addEventListener("click", function () { setView("study"); });
    vid.addEventListener("error", function (e) { if (!vid.getAttribute("src")) return; V.stageErr = vid.isYT ? YTP.errText(e && e.detail) : "브라우저가 이 영상을 재생하지 못해요. MP4(H.264 영상, AAC 오디오)가 가장 잘 돼요."; stopAll(); renderStage(); });
    if (vid.isYT) {
      vid.addEventListener("meta", function (e) {
        var ep = EPS["yt:" + vid.id]; if (!ep || !ep.titleAuto || !e.detail || !e.detail.title) return;
        ep.title = e.detail.title; ep.titleAuto = false; saveEp(ep); if (V.view === "study") renderStage(); if (V.modal) renderModal();
      });
      vid.addEventListener("noresponse", function () { V.stageErr = "유튜브 플레이어가 응답하지 않아요. 영상 화면에 오류 번호가 보이면 그 번호를 확인해 주세요. 페이지를 새로 고치면 풀리기도 해요."; renderStage(); });
      vid.addEventListener("ready", function () { if (V.stageErr && /응답하지 않아요/.test(V.stageErr)) { V.stageErr = ""; renderStage(); } });
      vid.addEventListener("statechange", function (e) { if (e.detail === 1 && V.stageErr) { V.stageErr = ""; renderStage(); } });
    }
    vid.addEventListener("ended", function () { if (V.watch) toast("끝까지 봤어요. 위의 '퀴즈 시작'을 누르세요."); });
    window.addEventListener("hashchange", function () { var v = location.hash.replace("#", ""); if (v && v !== V.view) setView(v); });
    window.addEventListener("pagehide", function () { if (Store.ok) Store.set("state", S); });
    if (Env.synth) { try { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = noop; } catch (e) { /* ignore */ } }
  }

  async function init() {
    vid = YTMODE ? YTP.create($("ytHost")) : $("vid");
    hooks.play = renderPlayState; hooks.word = setWord; hooks.stage = renderStage;
    await loadAll();
    resetLine();
    bind();
    if (YTMODE && !Env.ai) Env.ai = makeLocalAI();
    if (YTMODE && S.step === "dub") S.step = "shadow";
    if (YTMODE && Env.ai && Env.ai.onQueue) Env.ai.onQueue(function () { if (V.popup && V.popup.aiBusy) renderPopup(); });
    initEnv(function () { renderHud(); if (V.view === "study") renderPasses(); if (V.modal) renderModal(); if (V.popup && Env.ai && !V.popup.ai && !V.popup.aiBusy) aiExplain(); });
    if (!YTMODE && Store.ok) Store.get("dir").then(function (d) { if (d && d.requestPermission) { V.dirHandle = d; if (V.view === "study") renderStage(); } });
    var v = location.hash.replace("#", "");
    V.view = VIEWS.some(function (x) { return x[0] === v; }) ? v : "study";
    renderAll();
    if (YTMODE && V.view === "study" && VID[S.cur.ep]) attachVideo(curEp());
    if (YTMODE) maybeScan(EPS[S.cur.ep]);
    document.documentElement.setAttribute("data-ready", "1");
  }
  window.SceneLoop = { S: S, EPS: EPS, VID: VID, V: V, Env: Env, P: P, TAKES: TAKES, handleFiles: handleFiles, gotoLine: gotoLine, setStep: setStep, setView: setView, openPopupSpan: openPopupSpan, gradeDict: gradeDict, playCurrent: playCurrent };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();

</script>
</body>
</html>
