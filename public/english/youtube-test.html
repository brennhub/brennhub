<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>유튜브 재생 테스트</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f3f4f6,#14161a);--card:light-dark(#fff,#1f2228);--ink:light-dark(#15171b,#eceef2);--mute:light-dark(#5b6170,#a3a9b6);--ok:#1f8a4c;--bad:#c0392b;--wait:#b7791f;--acc:#2a5bd7}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI","Malgun Gothic",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:26px;margin:0 0 4px}
p.sub{margin:0 0 18px;color:var(--mute)}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.status{margin:14px 0;padding:12px 14px;border-radius:8px;background:var(--card);border-left:6px solid var(--wait)}
.status.ok{border-color:var(--ok)}.status.bad{border-color:var(--bad)}
.status b{display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button{font:inherit;font-size:15px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--mute);background:var(--card);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.time{font-size:22px;font-variant-numeric:tabular-nums}
.box{background:var(--card);border-radius:8px;padding:14px 16px;margin-top:18px}
.box ol{margin:6px 0 0;padding-left:20px}
small{color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>유튜브 재생 테스트</h1>
<p class="sub">이 파일 안에서 유튜브 영상이 재생되고, 앱이 영상을 조종할 수 있는지 확인하는 페이지예요.</p>

<div class="frame">
  <iframe id="yt" referrerpolicy="strict-origin-when-cross-origin"
    allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="YouTube"></iframe>
</div>

<div id="status" class="status"><b>연결 중...</b><span>유튜브 플레이어의 응답을 기다리고 있어요.</span></div>

<div class="row">
  <span class="time" id="time">0:00.0</span>
  <small id="rate" style="align-self:center">속도 1배</small>
</div>
<div class="row">
  <button id="bPlay">재생</button>
  <button id="bPause">멈춤</button>
  <button id="bSeek">1:00으로 이동</button>
  <button id="bSlow">0.75배속</button>
  <button id="bNorm">1배속</button>
  <button id="bLoop">지금부터 5초 반복</button>
</div>

<div class="box">
  <b>확인할 것</b>
  <ol>
    <li>검은 화면 안에 영상이 보이나요, 아니면 오류 번호(예: 오류 153)가 보이나요?</li>
    <li>위의 연결 상태 줄에 뭐라고 나오나요?</li>
    <li>영상이 보이면 버튼 6개를 눌러 보세요. 시간 숫자가 움직이고, "5초 반복"이 같은 5초를 계속 다시 트는지 봐 주세요.</li>
  </ol>
</div>
</main>

<script>
{
const VID = "y9Trdafp83U";
const YT = "https://www.youtube.com";
const iframe = document.getElementById("yt");
const statusEl = document.getElementById("status");
const timeEl = document.getElementById("time");
const rateEl = document.getElementById("rate");
let ready = false, cur = 0, loopFrom = null, tries = 0, listenTimer = null;

const ERR = {
  2: "영상 주소가 잘못됐어요.",
  5: "브라우저가 이 영상을 재생하지 못했어요.",
  100: "영상이 없거나 비공개예요.",
  101: "영상 주인이 다른 사이트에서의 재생을 막아 두었어요.",
  150: "영상 주인이 다른 사이트에서의 재생을 막아 두었어요.",
  152: "유튜브 플레이어 설정 오류예요.",
  153: "이 페이지가 자기 출처 정보(Referer)를 보내지 않아서 유튜브가 재생을 막았어요."
};

function setStatus(kind, title, msg) {
  statusEl.className = "status" + (kind ? " " + kind : "");
  statusEl.innerHTML = "";
  const b = document.createElement("b"); b.textContent = title;
  const s = document.createElement("span"); s.textContent = msg;
  statusEl.append(b, s);
}

function send(obj) {
  if (!iframe.contentWindow) return;
  iframe.contentWindow.postMessage(JSON.stringify(Object.assign({ id: 1, channel: "widget" }, obj)), YT);
}
function cmd(func, args) { send({ event: "command", func: func, args: args || [] }); }

function fmt(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
}

const params = new URLSearchParams({ enablejsapi: "1", playsinline: "1", rel: "0" });
if (location.origin && location.origin !== "null") params.set("origin", location.origin);
iframe.src = YT + "/embed/" + VID + "?" + params.toString();

iframe.addEventListener("load", function () {
  listenTimer = setInterval(function () {
    tries++;
    send({ event: "listening" });
    if (tries === 16 && !ready) {
      setStatus("bad", "응답 없음",
        "8초 동안 유튜브 플레이어가 응답하지 않았어요. 영상 화면에 오류 번호가 보이면 그 번호를 알려주세요. 이 파일 주소: " + location.protocol + "//");
    }
    if (ready || tries > 60) clearInterval(listenTimer);
  }, 500);
});

window.addEventListener("message", function (e) {
  if (e.origin !== YT && e.origin !== "https://www.youtube-nocookie.com") return;
  let d; try { d = typeof e.data === "string" ? JSON.parse(e.data) : e.data; } catch (_) { return; }
  if (!d || !d.event) return;
  if (d.event === "onReady" || (d.event === "initialDelivery" && !ready)) {
    if (!ready) {
      ready = true;
      ["onStateChange", "onError", "onPlaybackRateChange"].forEach(function (ev) { cmd("addEventListener", [ev]); });
      setStatus("ok", "연결됨", "유튜브 플레이어가 응답했어요. 영상이 보이면 버튼을 눌러 보세요.");
    }
  }
  if (d.event === "onError") {
    const code = Number(d.info);
    setStatus("bad", "오류 " + code, ERR[code] || "알 수 없는 오류예요.");
  }
  const info = d.info && typeof d.info === "object" ? d.info : null;
  if (info) {
    if (typeof info.currentTime === "number") {
      cur = info.currentTime;
      timeEl.textContent = fmt(cur);
      if (loopFrom !== null && cur >= loopFrom + 5) cmd("seekTo", [loopFrom, true]);
    }
    if (typeof info.playbackRate === "number") rateEl.textContent = "속도 " + info.playbackRate + "배";
  }
  if (d.event === "onPlaybackRateChange") rateEl.textContent = "속도 " + d.info + "배";
});

const loopBtn = document.getElementById("bLoop");
document.getElementById("bPlay").addEventListener("click", function () { cmd("playVideo"); });
document.getElementById("bPause").addEventListener("click", function () { cmd("pauseVideo"); });
document.getElementById("bSeek").addEventListener("click", function () { cmd("seekTo", [60, true]); });
document.getElementById("bSlow").addEventListener("click", function () { cmd("setPlaybackRate", [0.75]); });
document.getElementById("bNorm").addEventListener("click", function () { cmd("setPlaybackRate", [1]); });
loopBtn.addEventListener("click", function () {
  if (loopFrom === null) {
    loopFrom = cur;
    loopBtn.classList.add("on");
    loopBtn.textContent = "반복 끄기 (" + fmt(loopFrom) + "부터 5초)";
    cmd("playVideo");
  } else {
    loopFrom = null;
    loopBtn.classList.remove("on");
    loopBtn.textContent = "지금부터 5초 반복";
  }
});
}
</script>
</body>
</html>
